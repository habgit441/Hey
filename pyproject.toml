[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hey-ai"
version = "0.1.0"
description = "A floating desktop orb for HEY AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
hey-ai = "hey_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
